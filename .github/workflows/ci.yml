name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build/end-to-end-v1

permissions:
  contents: read

concurrency:
  group: civil-job-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest
