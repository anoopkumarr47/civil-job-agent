name: CI

on:
  pull_request:
  push:
    branches:
      - build/end-to-end-v1

permissions:
  contents: read

concurrency:
  group: civil-job-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest

  live-public-dry-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/end-to-end-v1'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Validate integration secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY"
          test -n "$EMAIL_ADDRESS"
          test -n "$EMAIL_PASSWORD"

      - name: Full integration dry run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-oss-120b' }}
          AI_REQUIRED: "true"
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: "true"
          MIN_SUCCESSFUL_SOURCES: "2"
          MAX_LINKS_PER_SOURCE: "40"
          MAIL_LOOKBACK_DAYS: "3"
        run: python -m civil_job_agent.main
