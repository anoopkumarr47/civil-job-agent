name: CI

on:
  pull_request:
  push:
    branches:
      - build/end-to-end-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest

  live-public-dry-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/end-to-end-v1'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Public-source dry run
        env:
          DRY_RUN: "true"
          AI_REQUIRED: "false"
          MIN_SUCCESSFUL_SOURCES: "2"
          MAX_LINKS_PER_SOURCE: "40"
        run: python -m civil_job_agent.main
