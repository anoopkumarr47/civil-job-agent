name: Ireland Civil Job Agent

on:
  schedule:
    # 08:00 and 20:00 India Standard Time (UTC+05:30)
    - cron: "30 2,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run discovery/classification without email or state persistence"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - build/end-to-end-v1

concurrency:
  group: ireland-civil-job-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover-rank-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium

      - name: Run regression tests
        run: pytest

      - name: Validate configured mailbox
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import os

          expected = "anoopkumarremesanpillai@gmail.com"
          sender = os.environ.get("EMAIL_ADDRESS", "").strip().lower()
          recipient = os.environ.get("EMAIL_TO", "").strip().lower()

          if sender != expected:
              raise RuntimeError("EMAIL_ADDRESS is not configured for the civil-job-agent Gmail account")
          if recipient != expected:
              raise RuntimeError("EMAIL_TO is not configured for the civil-job-agent Gmail account")

          print("Civil-job-agent sender and recipient secrets validated")
          PY

      - name: Validate Gmail SMTP authentication
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib

          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as server:
              server.starttls()
              server.login(os.environ["EMAIL_ADDRESS"], os.environ["EMAIL_PASSWORD"])
              code, _ = server.noop()
              if code != 250:
                  raise RuntimeError(f"Unexpected SMTP NOOP response: {code}")
          print("Gmail SMTP authentication verified without sending mail")
          PY

      - name: Run actual job agent
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL || 'gpt-oss-120b' }}
          CEREBRAS_MIN_INTERVAL_SECONDS: "2.2"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-oss-120b' }}
          AI_MIN_INTERVAL_SECONDS: "12"
          AI_MAX_EVIDENCE_CHARS: "6000"
          AI_TOKEN_RESERVE: "2400"
          AI_REQUIRED: ${{ github.event_name == 'push' && 'true' || 'false' }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          STATE_FILE: "job_state.json"
          DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          MAIL_LOOKBACK_DAYS: "3"
          MAX_LINKS_PER_SOURCE: "120"
          MIN_SUCCESSFUL_SOURCES: "2"
        run: python -m civil_job_agent.main

      - name: Persist state
        if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        run: |
          set -euo pipefail
          if [ ! -f job_state.json ]; then
            echo "No job_state.json to persist"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job_state.json

          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "Update civil job state [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "State push attempt ${attempt} failed"
            sleep $((attempt * 3))
          done
          exit 1
