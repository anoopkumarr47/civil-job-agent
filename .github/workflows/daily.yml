name: Ireland Civil Job Agent

on:
  schedule:
    # 08:00 and 20:00 India Standard Time (UTC+05:30)
    - cron: "30 2,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run discovery/classification without email or state persistence"
        required: false
        type: boolean
        default: false

concurrency:
  group: ireland-civil-job-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover-rank-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium

      - name: Run regression tests
        run: pytest

      - name: Validate AI configuration
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::At least one AI provider key is required"
            exit 1
          fi
          [ -n "$GROQ_API_KEY" ] || echo "::warning::GROQ_API_KEY is missing; Gemini will be the only AI provider"
          [ -n "$GEMINI_API_KEY" ] || echo "::warning::GEMINI_API_KEY is missing; Groq will be the only AI provider"
          echo "AI provider secrets validated"

      - name: Validate mail configuration
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          set -euo pipefail
          test -n "$EMAIL_ADDRESS"
          test -n "$EMAIL_PASSWORD"
          test -n "$EMAIL_TO"
          echo "Mail secrets are configured"

      - name: Validate Gmail SMTP authentication
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib

          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as server:
              server.starttls()
              server.login(os.environ["EMAIL_ADDRESS"], os.environ["EMAIL_PASSWORD"])
              code, _ = server.noop()
              if code != 250:
                  raise RuntimeError(f"Unexpected SMTP NOOP response: {code}")
          print("Gmail SMTP authentication verified without sending mail")
          PY

      - name: Run actual job agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model IDs are intentionally pinned in version control. Do not inherit stale repo variables.
          GROQ_MODEL: "openai/gpt-oss-20b"
          GEMINI_MODEL: "gemini-3.5-flash"
          GROQ_MIN_INTERVAL_SECONDS: "8"
          AI_MAX_EVIDENCE_CHARS: "3000"
          AI_PREFLIGHT: "true"
          AI_MAX_PROVISIONAL_RATIO: "0.25"
          RUN_HEALTH_FILE: "run_health.json"
          AI_REQUIRED: "false"
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          STATE_FILE: "job_state.json"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MAIL_LOOKBACK_DAYS: "4"
          MAX_LINKS_PER_SOURCE: "160"
          MIN_SUCCESSFUL_SOURCES: "3"
        run: python -m civil_job_agent.main

      - name: Persist state
        if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        run: |
          set -euo pipefail
          if [ ! -f job_state.json ]; then
            echo "No job_state.json to persist"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job_state.json

          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "Update civil job state [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "State push attempt ${attempt} failed"
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce sweep health
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("run_health.json")
          if not path.exists():
              raise SystemExit("run_health.json was not produced; the sweep did not complete cleanly")

          health = json.loads(path.read_text(encoding="utf-8"))
          status = health.get("status", "failed")
          reasons = health.get("reasons", [])
          print(f"Sweep health: {status}")
          if reasons:
              print("Reasons: " + "; ".join(reasons))
          if status != "healthy":
              print(f"::error::Civil job sweep is {status}: {'; '.join(reasons)}")
              raise SystemExit(1)
          PY
