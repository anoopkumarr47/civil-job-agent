[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ireland-civil-job-agent"
version = "1.0.0"
description = "Daily Ireland civil engineering job discovery and relocation-fit alert agent"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.15.0",
  "playwright==1.62.0",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
civil-job-agent = "civil_job_agent.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
